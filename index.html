const Header = ({ page, go }: any) => {
  const [theme, setTheme] = useState(document.documentElement.dataset.theme || 'light');
  const toggleTheme = () => { const next = theme === 'light' ? 'dark' : 'light'; setTheme(next); document.documentElement.dataset.theme = next; };
  const items = [['landing', 'Beranda'], ['student', 'Mahasiswa'], ['lecturer', 'Dosen']];
  return (
    <header className="sticky z-20 bg-[#FCDB02] text-[#1F2933] shadow-sm" style={{ top: 'env(safe-area-inset-top,0px)' }}>
      <div className="relative w-full px-3 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-x-3 gap-y-2">

        <nav className="order-3 flex w-full justify-center gap-1 overflow-x-auto text-sm font-semibold sm:absolute sm:left-1/2 sm:top-1/2 sm:order-none sm:w-auto sm:max-w-[45vw] sm:-translate-x-1/2 sm:-translate-y-1/2">
          {items.map(([k, l]) => (
            <button key={k} onClick={() => go(k)} className={`shrink-0 px-3 py-2 rounded-lg whitespace-nowrap ${page === k || (k === 'history' && page === 'detail') ? 'bg-[#1F2933] text-white' : 'hover:bg-black/10'}`}>{l}</button>

const Student = ({ s }: any) => {
  const [code, setCode] = useState('');
  const [err, setErr] = useState('');
  const [txt, setTxt] = useState('');
  const { sess, joined, mine } = s;
  const join = () => {
    if (code.trim().toUpperCase() === sess.code && sess.status === 'live') { s.setJoined(true); setErr(''); }
    else setErr(sess.status !== 'live' ? 'Sesi belum dimulai atau sudah berakhir.' : 'Kode kelas tidak ditemukan. Periksa kembali.');
  };
  if (!joined)
    return (
      <div className="max-w-md mx-auto px-4 py-12">
        <Card>
          <h1 className="text-xl font-bold">Masuk ke Sesi Kuliah</h1>
          <input value={code} onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && join()} placeholder="UI-0000" className="mt-4 w-full rounded-xl border border-line bg-bg px-4 py-3 text-lg tracking-widest font-semibold uppercase outline-none focus:border-[#FCDB02]" />
          <p className="text-sm text-mute mt-2">Masukkan kode kelas</p>
          {err && <p className="text-sm text-[#E74C3C] mt-2">{err}</p>}
          <Btn kind="yellow" className="w-full mt-4" onClick={join}>Masuk Sesi</Btn>
          
        </Card>
      </div>
    );
  return (
    <div className="max-w-3xl mx-auto px-4 py-8 space-y-5">
      <Card>
        <div className="flex items-start justify-between gap-3">
          <div>
            <p className="text-xs font-semibold text-mute uppercase tracking-wide">Mata kuliah</p>
            <h1 className="text-xl font-bold">{sess.course}</h1>
            
          </div>
          {sess.status === 'live' ? <span className="text-xs font-semibold text-[#27AE60] flex items-center gap-1.5"><i className="live-dot w-2 h-2 rounded-full bg-[#2ECC71]" />Berlangsung</span> : <span className="text-xs font-semibold text-mute">Sesi berakhir</span>}
        </div>
        <div className="mt-4 rounded-xl bg-bg px-4 py-3 text-sm"><span className="text-mute">Topik saat ini: </span><b>{sess.topic}</b></div>
      </Card>
      <Card>
        <h2 className="font-bold text-center">Seberapa paham kamu dengan materi ini?</h2>
        <div className="mt-6 flex flex-wrap justify-center gap-6">
          {KEYS.map((k) => (
            <button key={k} aria-pressed={mine === k} disabled={sess.status !== 'live'} onClick={() => s.setMine(k)} className="flex flex-col items-center gap-2 disabled:opacity-40">
              <span className="w-24 h-24 sm:w-28 sm:h-28 rounded-full shadow-md transition hover:scale-105 flex items-center justify-center text-white text-4xl" style={{ background: LV[k].c, outline: mine === k ? `4px solid ${LV[k].c}55` : 'none', outlineOffset: 4, opacity: mine && mine !== k ? 0.45 : 1 }}>{mine === k ? '✓' : ''}</span>
              <span className="text-sm font-semibold">{LV[k].label}</span>
            </button>
          ))}
        </div>
        <p className="mt-5 text-center text-sm min-h-[1.25rem]" style={{ color: mine ? LV[mine].c === '#F1C40F' ? '#B7791F' : LV[mine].c : undefined }}>
          {mine ? `✓ Respons diterima: ${LV[mine].label}. Kamu bisa mengubahnya kapan saja.` : <span className="text-mute">Ketuk salah satu lingkaran untuk memberi respons.</span>}
        </p>
        <p className="text-center text-xs text-mute mt-1">Responsmu bersifat anonim dan hanya tampil sebagai angka agregat.</p>
      </Card>
      <Card>
        <h2 className="font-bold">Pertanyaan Anonim</h2>
        <textarea value={txt} onChange={(e) => setTxt(e.target.value)} rows={3} placeholder="Tulis pertanyaanmu di sini..." className="mt-3 w-full rounded-xl border border-line bg-bg px-4 py-3 text-sm outline-none focus:border-[#FCDB02]" />
        <div className="flex justify-end mt-2"><Btn kind="yellow" disabled={!txt.trim() || sess.status !== 'live'} onClick={() => { s.addQ(txt.trim()); setTxt(''); }}>Kirim ke Dosen</Btn></div>
        <ul className="mt-4 space-y-3">
          {s.qs.map((q: Q) => (
            <li key={q.id} className="rounded-xl border border-line p-4">
              <div className="flex flex-wrap items-center justify-between gap-2"><span className="text-xs text-mute">{q.mine ? 'Pertanyaanmu · Anonim' : 'Anonim'}</span><Badge s={q.status} /></div>
              <p className="mt-2 text-sm">{q.text}</p>
              {q.answer && <p className="mt-3 text-sm rounded-lg bg-bg p-3"><b>Jawaban dosen:</b> {q.answer}</p>}
            </li>
          ))}
        </ul>
      </Card>
      <div className="text-center"><Btn kind="ghost" onClick={() => s.setJoined(false)}>Keluar dari Sesi</Btn></div>
    </div>
  );
};

const QItem = ({ q, set }: any) => {
  const [open, setOpen] = useState(false);
  const [a, setA] = useState('');
  return (
    <li className="rounded-xl border border-line p-4">
      <div className="flex flex-wrap items-center gap-2 justify-between">
        <span className="text-xs text-mute">Anonim</span>
        <span className="flex gap-2 items-center">{q.saved && <span className="text-xs font-semibold text-mute">🔖 Disimpan</span>}<Badge s={q.status} /></span>
      </div>
      <p className="mt-2 text-sm">{q.text}</p>
      {q.answer && <p className="mt-3 text-sm rounded-lg bg-bg p-3"><b>Jawabanmu:</b> {q.answer}</p>}
      {q.status !== 'done' && (
        <div className="mt-3 flex flex-wrap gap-2">
          <Btn kind="ghost" className="!py-1.5 !text-xs" onClick={() => set(q.id, { status: 'discuss' })}>Tandai untuk Dibahas</Btn>
          <Btn kind="ghost" className="!py-1.5 !text-xs" onClick={() => setOpen(!open)}>Jawab</Btn>
          <Btn kind="ghost" className="!py-1.5 !text-xs" onClick={() => set(q.id, { saved: !q.saved })}>{q.saved ? 'Batal Simpan' : 'Simpan untuk Nanti'}</Btn>
        </div>
      )}
      {open && q.status !== 'done' && (
        <div className="mt-3">
          <textarea value={a} onChange={(e) => setA(e.target.value)} rows={2} placeholder="Tulis jawaban..." className="w-full rounded-xl border border-line bg-bg px-3 py-2 text-sm outline-none focus:border-[#FCDB02]" />
          <Btn kind="yellow" className="mt-2 !py-1.5 !text-xs" disabled={!a.trim()} onClick={() => { set(q.id, { status: 'done', answer: a.trim() }); setOpen(false); }}>Kirim Jawaban</Btn>
        </div>
      )}
    </li>
  );
};


const DOSEN_CODES: Record<string, string> = {
  'Lecturer-001': 'Dosen 1',
  'Lecturer-002': 'Dosen 2',
  'Lecturer-003': 'Dosen 3',
};
const LecturerLogin = ({ onLogin, go }: any) => {
  const [code, setCode] = useState('');
  const [error, setError] = useState('');
  const submit = () => {
    const normalized = code.trim().toLowerCase();
    const validCode = Object.keys(DOSEN_CODES).find(key => key.toLowerCase() === normalized);
    if (validCode) onLogin(validCode);
    else setError('Kode dosen tidak valid. Periksa kembali kode yang diberikan.');
  };
  return <div className="max-w-lg mx-auto px-4 py-12"><Card>
    <h1 className="text-2xl font-bold">Login Dosen</h1>
    <p className="mt-2 text-sm text-mute">Masukkan kode dosen untuk membuka dashboard dan riwayat perkuliahan.</p>
    <input value={code} onChange={e => { setCode(e.target.value); setError(''); }} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="Masukkan kode dosen" autoComplete="off" className="mt-5 w-full rounded-xl border border-line bg-bg px-4 py-3 font-semibold tracking-wide outline-none focus:border-[#FCDB02]" />
    {error && <p role="alert" className="mt-2 text-sm text-red-500">{error}</p>}
    <div className="mt-4 flex gap-2"><Btn kind="yellow" onClick={submit}>Masuk</Btn><Btn kind="ghost" onClick={() => go('landing')}>Kembali</Btn></div>
    <div className="mt-5 rounded-xl bg-bg p-3 text-xs text-mute"><b>Kode demo:</b> Lecturer-001, Lecturer-002, Lecturer-003. Setiap kode mewakili akun dosen demo yang berbeda.</div>
  </Card></div>;
};

const Lecturer = ({ s, go }: any) => {
  const [course, setCourse] = useState('');
  const [topic, setTopic] = useState('');
  const { sess, dist, present, thr } = s;
  const resp = tot(dist);
  const weak = pc(dist.r + dist.y, resp);
  const alert = sess.status === 'live' && resp > 0 && weak >= thr;
  const stats = [['Mahasiswa hadir', present], ['Sudah memberi feedback', `${resp}/${present}`], ['Sudah paham', `${pc(dist.g, resp)}%`]];
  return (
    <div className="max-w-6xl mx-auto px-4 py-8 space-y-5">
      <Card>
        {sess.status === 'ended' || !sess.course ? (
          <div className="grid gap-3 sm:grid-cols-[1fr_1fr_auto] items-end">
            <div className="sm:col-span-3"><h1 className="text-xl font-bold">Buat Sesi Perkuliahan Baru</h1><p className="text-sm text-mute">Kode kelas dibuat otomatis setelah sesi dibuat.</p></div>
            <label className="text-xs font-semibold text-mute">Mata kuliah<input value={course} onChange={(e) => setCourse(e.target.value)} placeholder="Nama Mata Kuliah" className="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-2.5 text-sm text-ink outline-none focus:border-[#FCDB02]" /></label>
            <label className="text-xs font-semibold text-mute">Topik<input value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Topik pembahasan" className="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-2.5 text-sm text-ink outline-none focus:border-[#FCDB02]" /></label>
            <Btn kind="yellow" disabled={!course.trim() || !topic.trim()} onClick={() => s.create(course.trim(), topic.trim())}>Buat Sesi</Btn>
          </div>
        ) : (
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <p className="text-xs font-semibold text-mute uppercase tracking-wide flex items-center gap-2">Sesi aktif {sess.status === 'live' && <span className="flex items-center gap-1 text-[#27AE60] normal-case"><i className="live-dot w-2 h-2 rounded-full bg-[#2ECC71]" />Langsung</span>}</p>
              <h1 className="text-xl font-bold">{sess.course}</h1>
              <p className="text-sm text-mute">Topik: {sess.topic}</p>
            </div>
            <div className="flex items-center gap-3 flex-wrap">
              <div className="rounded-xl bg-bg px-4 py-2 text-center"><p className="text-[10px] uppercase font-semibold text-mute">Kode kelas</p><p className="text-xl font-extrabold tracking-widest">{sess.code}</p></div>
              {sess.status === 'ready' ? <Btn kind="yellow" onClick={s.start}>Mulai Sesi</Btn> : <Btn kind="red" onClick={s.end}>Akhiri Sesi</Btn>}
            </div>
          </div>
        )}
      </Card>
      {alert && <div role="alert" className="rounded-2xl px-5 py-4 font-semibold text-sm" style={{ background: '#E74C3C22', color: '#E74C3C', border: '1px solid #E74C3C66' }}>⚠ Sebagian besar mahasiswa masih membutuhkan penjelasan tambahan. ({weak}% memberi respons merah atau kuning)</div>}
      <div className="grid gap-3 sm:grid-cols-3">
        {stats.map(([l, v]) => <Card key={l as string}><p className="text-xs font-semibold text-mute">{l}</p><p className="text-3xl font-extrabold mt-1">{v}</p></Card>)}
      </div>
      <div className="grid gap-5 lg:grid-cols-5">
        <div className="lg:col-span-2 space-y-5">
          <Card>
            <h2 className="font-bold">Distribusi Pemahaman</h2>
            <div className="mt-4"><StackBar d={dist} /></div>
            <div className="mt-5 space-y-3">
              {KEYS.map((k) => (
                <div key={k}>
                  <div className="flex justify-between text-sm"><span className="flex items-center gap-2"><i className="w-3 h-3 rounded-full" style={{ background: LV[k].c }} />{LV[k].label}</span><b>{dist[k]} · {pc(dist[k], resp)}%</b></div>
                  <div className="h-2 rounded-full bg-line mt-1 overflow-hidden"><div className="h-full transition-all duration-500" style={{ width: `${pc(dist[k], resp)}%`, background: LV[k].c }} /></div>
                </div>
              ))}
            </div>
            
          </Card>
          <Card>
            <h2 className="font-bold">Ambang Notifikasi</h2>
            <p className="text-sm text-mute mt-1">Beri tahu saya jika respons merah + kuning mencapai <b className="text-ink">{thr}%</b>.</p>
            <input type="range" min={10} max={90} step={5} value={thr} onChange={(e) => s.setThr(+e.target.value)} className="w-full mt-3 accent-[#F1C40F]" />
          </Card>
        </div>
        <Card className="lg:col-span-3">
          <div className="flex items-center justify-between"><h2 className="font-bold">Pertanyaan Anonim ({s.qs.length})</h2><span className="text-xs text-mute">{s.qs.filter((q: Q) => q.status === 'done').length} terjawab</span></div>
          <ul className="mt-4 space-y-3">
            {s.qs.length === 0 && <li className="text-sm text-mute">Belum ada pertanyaan masuk.</li>}
            {[...s.qs].sort((a: Q, b: Q) => b.id - a.id).map((q: Q) => <QItem key={q.id} q={q} set={s.setQ} />)}
          </ul>
        </Card>
      </div>
      <div className="text-center"><Btn kind="ghost" onClick={() => { const code = window.prompt('Masukkan kode dosen untuk membuka riwayat:'); if (['Lecturer-001', 'Lecturer-002', 'Lecturer-003'].includes(code || '')) go('history'); else if (code !== null) window.alert('Kode dosen tidak valid.'); }}>Lihat Riwayat Perkuliahan</Btn></div>
    </div>
  );
};

const topRed = (h: Hist) => [...h.topics].sort((a, b) => b.r - a.r)[0];

const History = ({ hist, open }: any) => (
  <div className="max-w-4xl mx-auto px-4 py-8">
    <h1 className="text-2xl font-bold">Riwayat Perkuliahan</h1>
    <ul className="mt-5 space-y-3">
      {hist.map((h: Hist) => (
        <li key={h.id}>
          <button onClick={() => open(h.id)} className="w-full text-left"><Card className="hover:shadow-md transition">
            <div className="flex flex-wrap justify-between gap-1"><b>{h.course}</b><span className="text-sm text-mute">{h.date}</span></div>
            <p className="text-sm text-mute">{h.topic}</p>
            <div className="mt-3"><StackBar d={h.dist} /></div>
            <div className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-xs text-mute">
              <span>Paling banyak merah: <b className="text-ink">{topRed(h).name}</b></span>
              <span>Pertanyaan: <b className="text-ink">{h.qDone}/{h.qIn}</b> terjawab</span>
            </div>
          </Card></button>
        </li>
      ))}
    </ul>
  </div>
);

const Detail = ({ h, back }: any) => {
  const t = tot(h.dist);
  return (
    <div className="max-w-4xl mx-auto px-4 py-8 space-y-5">
      <Btn kind="ghost" onClick={back}>← Kembali ke Riwayat</Btn>
      <Card>
        <p className="text-sm text-mute">{h.date} · {h.present} mahasiswa hadir</p>
        <h1 className="text-xl font-bold">{h.course}</h1>
        <p className="text-sm text-mute">{h.topic}</p>
        <div className="mt-4"><StackBar d={h.dist} /></div>
        <div className="mt-4 grid grid-cols-3 gap-3 text-center">
          {KEYS.map((k) => <div key={k} className="rounded-xl bg-bg py-3"><p className="text-2xl font-extrabold" style={{ color: k === 'y' ? '#D99A00' : LV[k].c }}>{pc(h.dist[k], t)}%</p><p className="text-xs text-mute">{LV[k].label} ({h.dist[k]})</p></div>)}
        </div>
      </Card>
      <Card>
        <h2 className="font-bold">Rekapitulasi per Subtopik</h2>
        <div className="mt-4 space-y-4">
          {h.topics.map((x: any) => (
            <div key={x.name}>
              <div className="flex justify-between text-sm"><span>{x.name}</span><span className="text-mute">{x.r} merah · {x.y} kuning · {x.g} hijau</span></div>
              <div className="mt-1"><StackBar d={x} /></div>
            </div>
          ))}
        </div>
        <p className="text-sm mt-5">Subtopik paling banyak respons merah: <b>{topRed(h).name}</b>. Pertanyaan masuk <b>{h.qIn}</b>, terjawab <b>{h.qDone}</b>.</p>
      </Card>
    </div>
  );
};

const App = () => {
  const [page, setPage] = useState('landing');
  const [lecturerCode, setLecturerCode] = useState<string | null>(null);
  const [detail, setDetail] = useState<number>(1);
  const [sess, setSess] = useState<any>({ course: '', lecturer: '', topic: '', code: '', status: 'ended' });
  const [sim, setSim] = useState({ r: 0, y: 0, g: 0, p: 0 });
  const [mine, setMine] = useState<K | null>(null);
  const [joined, setJoined] = useState(false);
  const [qs, setQs] = useState<Q[]>([]);
  const [thr, setThr] = useState(40);
  const [hist, setHist] = useState<Hist[]>([]);

  // Prototype mode: no fabricated live counters. Real cross-device realtime requires a backend/database.


  const dist: Dist = { r: sim.r + (mine === 'r' ? 1 : 0), y: sim.y + (mine === 'y' ? 1 : 0), g: sim.g + (mine === 'g' ? 1 : 0) };
  const present = sim.p + (joined && sess.status !== 'ready' ? 1 : 0);
  const go = (p: string) => { setPage(p); window.scrollTo(0, 0); };

  const s = {
    sess, dist, present, mine, joined, qs, thr, setThr, setJoined, setMine,
    addQ: (text: string) => setQs((q) => [...q, { id: Date.now(), text, status: 'wait', mine: true }]),
    setQ: (id: number, patch: Partial<Q>) => setQs((q) => q.map((x) => (x.id === id ? { ...x, ...patch } : x))),
    create: (course: string, topic: string) => {
      setSess({ course, topic, lecturer: 'Dr. Ir. Budi Santoso, M.T.', code: 'UI-' + (1000 + Math.floor(Math.random() * 9000)), status: 'ready' });
      setSim({ r: 0, y: 0, g: 0, p: 0 }); setMine(null); setJoined(false); setQs([]);
    },
    start: () => setSess((x: any) => ({ ...x, status: 'live' })),
    end: () => {
      setHist((h) => [{ id: Date.now(), date: '4 Nov 2026', course: sess.course, topic: sess.topic, present, dist, qIn: qs.length, qDone: qs.filter((q) => q.status === 'done').length, topics: [{ name: sess.topic, ...dist }] }, ...h]);
      setSess((x: any) => ({ ...x, status: 'ended' }));
    },
  };

  return (
    <div className="min-h-screen">
      <Header page={page} go={go} />
      {page === 'landing' && <Landing go={go} />}
      {page === 'student' && <Student s={s} />}
      {page === 'lecturer' && (lecturerCode ? <><div className="max-w-6xl mx-auto px-4 pt-4 flex justify-end"><Btn kind="ghost" onClick={() => { setLecturerCode(null); go('landing'); }}>Keluar dari akun dosen</Btn></div><Lecturer s={s} go={go} /></> : <LecturerLogin onLogin={(code: string) => setLecturerCode(code)} go={go} />)}
      {page === 'history' && (lecturerCode ? <History hist={hist} open={(id: number) => { setDetail(id); go('detail'); }} /> : <LecturerLogin onLogin={(code: string) => { setLecturerCode(code); go('history'); }} go={go} />)}
      {page === 'detail' && (lecturerCode ? <Detail h={hist.find((h) => h.id === detail) || hist[0]} back={() => go('history')} /> : <LecturerLogin onLogin={(code: string) => { setLecturerCode(code); go('history'); }} go={go} />)}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function () {
  try {
    var out = Babel.transform(document.getElementById('src').textContent, {
      presets: [['typescript', { isTSX: true, allExtensions: true }], 'react'], filename: 'app.tsx'
    }).code;
    var el = document.createElement('script'); el.text = out; document.body.appendChild(el);
  } catch (e) {
    document.getElementById('root').textContent = 'Gagal memuat aplikasi: ' + e.message;
  }
})();
</script>
</body>
</html>
